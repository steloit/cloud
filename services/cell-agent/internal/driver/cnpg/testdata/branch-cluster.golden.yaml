apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: svc_db01-branch
  namespace: proj--prod
  labels:
    steloit.dev/cell: 
    steloit.dev/branch-of: svc_db01
spec:
  instances: 1
  storage:
    storageClass: pd-cell
    size: 10Gi
  affinity:
    nodeSelector:
      pool: db-storage
    tolerations:
      - key: storage
        operator: Exists
        effect: NoSchedule
  bootstrap:
    recovery:
      volumeSnapshots:
        storage:
          name: svc_db01-snap-1
          kind: VolumeSnapshot
          apiGroup: snapshot.storage.k8s.io
