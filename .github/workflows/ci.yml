name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # authority-paths reads the PR diff via gh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Task files valid (schema, deps, caps)
        run: node scripts/spec-sync/validate.mjs
      - name: protect-authority hook regression tests
        run: bash .claude/hooks/protect-authority.test.sh
      - name: Authority paths unchanged (human decision only — AGENTS.md hard rule)
        if: github.event_name == 'pull_request'
        shell: bash   # GitHub's default is `bash -e {0}` with NO pipefail; without this a
                      # failing `gh pr diff` yields an empty changed-set and the step reports
                      # "untouched" — failing OPEN exactly when it did not run.
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The PreToolUse hook is an accident floor a determined agent can talk around.
          # This reads the PR diff, so no call-shape trick reaches it and --no-verify does
          # not apply. It REPORTS reliably; whether it BLOCKS depends on branch protection,
          # which this repo does not currently have — see O6g. Do not describe it as binding
          # until that is true.  O6f.
          #
          # gh pr diff, not `git diff BASE HEAD`: the checkout is shallow (head.sha is absent
          # -> "fatal: bad object"), and a two-dot range also re-reports paths that landed on
          # main after the branch started, which trains people to bypass on unrelated PRs.
          # Two statements, not one pipeline: a `gh` failure must fail the job, never produce
          # an empty changed-set that reads as "clean".
          files="$(gh pr diff "$PR" --name-only)"
          changed="$(printf '%s\n' "$files" | grep -E '^(docs/product/00-sources/|docs/product/18-philosophy/decisions\.md$)' || true)"
          [ -z "$changed" ] && { echo "authority-paths: untouched"; exit 0; }
          # The guarded set is FOUNDER-AUTHORITY paths only. ci.yml and .claude/hooks/ were in it
          # briefly and had to come out: they are engineering files under ADR-0008 review, so
          # guarding them made every legitimate maintenance PR require a founder marker (this
          # check failed its own PR, #292). It bought nothing either — a pull_request runs the
          # workflow from the PR head, so a PR deleting this step never evaluates its own
          # removal. Real self-protection needs a required check name under branch protection: O6g.
          #
          # The marker must be the FIRST line of the body. Matching anywhere let the job's own
          # failure text arm it, because the house rules require pasting CI output into the PR.
          if gh pr view "$PR" --json body -q .body | head -1 | grep -qE '^FOUNDER-RATIFIED\b'; then
            echo "authority-paths: changed WITH founder marker — allowed, recorded:"; echo "$changed"; exit 0
          fi
          echo "::error::These paths change by human decision only (AGENTS.md hard rules):"
          echo "$changed"
          echo "A founder-ratified change carries the ratification marker on the PR body's first line."
          exit 1
      - name: Client regeneration drift (type drift fails the build — Q3/§17)
        run: |
          make gen-ts
          git add -A -- apps packages docs
          git diff --cached --exit-code -- apps packages docs
      - name: Console lint + typecheck + tests + build
        run: |
          pnpm --filter console lint
          pnpm --filter console typecheck
          pnpm --filter console test
          pnpm --filter console build
      - name: SDK typecheck + tests
        run: |
          pnpm --filter @steloit/sdk typecheck
          pnpm --filter @steloit/sdk test
      - name: Canon invariants (typecheck + tests)
        run: |
          pnpm --filter @steloit/canon typecheck
          pnpm --filter @steloit/canon test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: "services/api/go.sum" }
      - name: Generate (drift fails the build — §16/§17)
        run: |
          make gen-go
          # gen-sql, not just gen-go: oapi-codegen regenerates the CONTRACT, but
          # db/queries/*.sql -> internal/*/store/*.sql.go has its own generator,
          # and only the generated file executes. Without this line a .sql edit
          # that never reached sqlc ships a query nobody reviewed, and every test
          # still passes because the tests run the generated file. US-1.3a was
          # the near-miss: a `AND status <> 'deleting'` fence present in the .sql
          # and absent from services.sql.go, so the security close was dead code.
          # sqlc is pinned (Makefile) — a version bump reformats generated output
          # and would fail this gate for the wrong reason.  O7.
          make gen-sql
          make gen-canon
          git add -A -- services packages apps
          git diff --cached --exit-code -- services packages apps
      # gofmt BEFORE the build, so a formatting failure reports as itself rather
      # than as a confusing test failure. `go vet` does not check formatting, so
      # nothing in this pipeline has ever reported it: two test files sat
      # unformatted on the base branch until O13 went looking.  O13
      - name: gofmt (every Go module)
        run: |
          set -euo pipefail
          # DERIVED from the repo, not retyped. The list was hardcoded here and
          # again in the test step below; a fifth module would silently get no
          # gofmt, no vet, no test and no -race, and nothing would say so. The
          # QA review confirmed the four are complete TODAY and that a module
          # outside them is invisible to this loop.
          for m in $(git ls-files '*/go.mod' | xargs -n1 dirname); do
            # 2>&1, and the exit-status check, are both load-bearing: gofmt writes
            # PARSE errors to stderr and lists nothing on stdout, so the obvious
            # `out="$(gofmt -l "$m")"` reports CLEAN for a file that does not
            # parse. Caught by mutating a file into a syntax error and watching
            # this step pass. `go build` would still fail such a commit, but a
            # gate that answers "clean" for input it could not read is a gate
            # that lies, and the next person to reuse this loop inherits it.
            if ! out="$(gofmt -l "$m" 2>&1)"; then
              echo "::error::gofmt could not read $m (a file may not parse):"; echo "$out"; exit 1
            fi
            [ -z "$out" ] || { echo "::error::unformatted Go files in $m:"; echo "$out"; exit 1; }
          done
      - name: Build + vet + test
        # STELOIT_REQUIRE_CONTAINERS turns a missing container runtime from a
        # SKIP into a FAILURE. Without it, internal/reconcile, internal/identity
        # and internal/platform/db each t.Skipf when Docker is unavailable and
        # the package still prints `ok` — so the job is green having run nothing.
        # -timeout 30m below is derived from identity measuring ~350s, which is
        # meaningless for a suite that skips; and -race never examines the
        # container-backed concurrency suites at all, which is where the next
        # such defect lives. (NOT where the last one did: O14's race was in
        # reconcile_test.go's in-memory fakes and runs either way.)  O23
        env:
          STELOIT_REQUIRE_CONTAINERS: "1"
        # -race, and this is the decision O13 asked for rather than a default.
        # It had never run in CI at all, which is how O14 (a data race in the
        # reconcile test fixture) reached the base branch and sat there a month.
        # Measured cost on this suite: ~4 min without, ~9 min with — identity
        # 274-332s and reconcile 113-129s dominate, and both are container-bound
        # rather than CPU-bound, so the detector is not the whole delta. Five
        # minutes is worth a detector that runs on every PR instead of never.
        #
        # -timeout 30m, explicitly: the default is 10 MINUTES PER PACKAGE, and
        # internal/identity measured 346s serially and EXCEEDED 600s under
        # contention on an M-series Mac (US-3.8). A hosted runner is slower. That
        # failure presents as a broken suite rather than as "raise the limit",
        # which is the kind of failure that gets diagnosed wrong.
        run: |
          # -count=1 DISABLES THE TEST CACHE, and it is load-bearing, not hygiene.
          #
          # THE BOUNDARY IS THE MODULE ROOT. Measured three ways (scratch module
          # and this repo):
          #   fixture in the test's own package testdata/   -> edit is caught
          #   fixture elsewhere in the SAME module          -> edit is caught
          #   fixture OUTSIDE the module root               -> `ok (cached)`,
          #                                                    edit is INVISIBLE
          # Live, with this repo's own wiring_test.go (which reads ci.yml five
          # directories up, outside services/api): disarming a gate is
          # `ok (cached)` without the flag and FAIL with it.
          #
          # actions/setup-go restores GOCACHE across commits keyed on go.sum, so a
          # PR touching only such a file could report green while broken. It fails
          # OPEN, which is the direction that matters. services/cell-agent's
          # parity_test.go reads repo-root infra/k8s/ and is in the same class.
          #
          # (An earlier revision of this comment said such a test is simply
          # UNCACHEABLE in and out of the module. That was wrong in both halves —
          # from a probe that read two fixtures in one test and never achieved a
          # cached run at all.)
          cd services/api && go build ./... && go vet ./... && go test -count=1 -race -timeout 30m ./...
          cd ../cell-agent && go build ./... && go vet ./... && go test -count=1 -race -timeout 10m ./...
          cd ../../packages/contracts/go && go build ./...
          cd ../../../apps/cli && go build ./... && go vet ./... && go test -count=1 -race -timeout 10m ./...
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.8" }
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      # T1.7: project-base is the ONLY declarer of google_project_service, and
      # infra/README.md's bootstrap contract applies it first on a clean project
      # with no manual `gcloud services enable` — so its list must cover every API
      # infra/ needs, starting with its own resources. It did not:
      # ci_plan_viewer is a project IAM binding and cloudresourcemanager was
      # absent, so the documented bootstrap step could not complete. This refuses
      # an unclassified google_* resource rather than skipping it, because a
      # lookup table that silently ignores what it does not know is how the gap
      # got there.
      - name: Required APIs are declared (T1.7)
        run: node scripts/infra/required-apis.mjs
      # T1.8: the list being complete (above) is not the same as anything WAITING
      # for it. google_project_service.enabled had zero edges in either direction,
      # so on a clean project every resource raced its own API. This asserts
      # REACHABILITY, not a direct edge — `depends_on = [module.project_base]`
      # orders against project-base's leaves, which depend on `enabled`; demanding
      # a direct edge would fail correct config and invite a redundant depends_on
      # to appease the checker.
      - name: API enablement is ordered before its consumers (T1.8)
        run: node scripts/infra/api-ordering.mjs
      - name: Validate envs (credential-free)
        run: |
          terraform -chdir=infra/envs/dev init -backend=false -input=false
          terraform -chdir=infra/envs/dev validate
          terraform -chdir=infra/envs/cell0 init -backend=false -input=false
          terraform -chdir=infra/envs/cell0 validate
      - name: Terraform tests (credential-free, mocked providers)
        shell: bash
        run: |
          # `terraform validate` checks syntax and types; it cannot check a VALUE.
          # These assert against the planned resource — e.g. that each ENV's cell
          # enables NetworkPolicy enforcement, which US-3.3a found nothing did
          # while every manifest and every test looked correct.
          #
          # `shell: bash` is load-bearing: GitHub's default is `bash -e {0}` with NO
          # pipefail. (`shell: bash` is already `-eo pipefail`, so the explicit
          # set below is redundant and kept only so the property is visible here.)
          #
          # DISCOVERY IS COMPARED AGAINST AN EXPECTED SET, not merely checked for
          # emptiness. Review measured both holes in the emptiness-only version:
          # deleting ONE env's tests/ directory left the gate green over the
          # remaining two, and hardcoding `dirs=infra/modules/gke-cell` passed the
          # Go pin as well — in both cases an env silently stopped being covered.
          # Every directory that instantiates the cell module must own a test.
          # `xargs -r` (--no-run-if-empty) is here for CI's shell, not for tidiness,
          # and it is NOT pinned by the harness — stated rather than left as an
          # apparent oversight. GNU xargs runs the command once on EMPTY input, so
          # `| xargs -0 -n1 dirname` exits 123 with "dirname: missing operand" and
          # `-e` kills the script at the assignment (measured in ubuntu:24.04,
          # rc=123 with no ::error:: annotation). BSD xargs on macOS does not run
          # on empty input at all and accepts -r as a no-op, so the two behave
          # identically here and no local test can tell them apart.
          #
          # Losing it therefore fails CLOSED — a red job with an opaque message,
          # not a green one — which is why this is a diagnostics fix rather than
          # a hole. The reason it matters is that rc=123 kills the script before
          # the coverage loop can name the uncovered directory.
          set -o pipefail
          dirs=$(git ls-files -z 'infra/**/*.tftest.hcl' 'infra/**/*.tftest.json' | xargs -0 -r -n1 dirname | sed 's#/tests$##' | sort -u)
          # DISCOVERY KEYS OFF THE MODULE SOURCE, not a label or a filename.
          # Measured: keying on `module "gke_cell"` in `*/main.tf` let three
          # semantics-preserving refactors drop an env out of the expected set
          # while its tests were deleted — the block moved to cell.tf (Terraform
          # loads every *.tf identically), the label renamed, or a cell placed
          # outside infra/envs/. The source path is the one string a cell
          # instantiation cannot omit.
          envs=$(git grep -lE 'source[[:space:]]*=[[:space:]]*".*modules/gke-cell"' -- 'infra/**/*.tf' ':(exclude)infra/modules/**' | xargs -r -n1 dirname | sort -u || true)
          if [ -z "$envs" ]; then
            echo "::error::cell discovery found no environments — this gate did not run"
            exit 1
          fi
          expected=$(printf '%s\ninfra/modules/gke-cell\n' "$envs" | sort -u)
          # There is deliberately no `-z "$dirs"` guard. It was here, and it is the
          # third branch on this step that turned out to be subsumed by the
          # per-directory loop below — which reports WHICH directory is uncovered
          # instead of "something is missing". Dropping it changed no outcome,
          # measured. Guards that nothing can distinguish are not guards.
          # ONE check per expected directory, not two. A set-difference against
          # $dirs was here and is gone: the loop below catches strictly more
          # (a directory with no tests AND one whose tests assert nothing), so
          # the comparison was a branch nothing could distinguish — dropping it
          # changed no outcome, measured. Fewer branches, each pinned.
          #
          # OWNING a test file is not asserting anything: a suite with zero run
          # blocks, and a directory with zero test files, BOTH exit 0 with
          # "Success! 0 passed, 0 failed".
          for d in $expected; do
            if ! grep -rqE '^[[:space:]]*run[[:space:]]+"' "$d"/tests/*.tftest.hcl "$d"/tests/*.tftest.json 2>/dev/null; then
              echo "::error::$d instantiates the cell but owns no terraform test with a run block — it asserts nothing"
              exit 1
            fi
            if ! grep -rq 'datapath_provider' "$d"/tests/*.tftest.hcl "$d"/tests/*.tftest.json 2>/dev/null; then
              echo "::error::$d's terraform test never mentions datapath_provider"
              exit 1
            fi
          done
          fail=0
          for d in $dirs; do
            echo "::group::terraform test $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" test || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: k8s manifests parse (always)
        run: |
          python3 -c "import glob,yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('infra/k8s/**/*.yaml', recursive=True)]"
          # A parse is CONTENT-BLIND: deny.log=false, a bogus apiVersion, a
          # misspelled kind, a different metadata.name and an empty spec all
          # parse — so these assertions pin the file's CONTENT.
          #
          # US-3.3c wired it: infra/modules/datapath-policy applies it in both env
          # layers. The grep below is the other half — a module can be deleted
          # from an env and `terraform test` stays green, which is exactly how
          # US-3.3f recorded this class for datapath_provider.
          for e in dev cell0; do
            grep -q 'module "datapath_policy"' "infra/envs/$e/main.tf" \
              || { echo "infra/envs/$e does not wire module.datapath_policy — network-logging.yaml is applied by nothing, and ADR-0015's first reason for Dataplane V2 rests on it"; exit 1; }
          done
          grep -q '^assert_boundary "' infra/spike/us33-e2e.sh \
            || { echo "us33-e2e.sh defines assert_boundary and never calls it — AC 7 is a no-op"; exit 1; }
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open('infra/k8s/policy/network-logging.yaml'))
          assert d['apiVersion'] == 'networking.gke.io/v1alpha1', d['apiVersion']
          assert d['kind'] == 'NetworkLogging', d['kind']
          # GKE PRE-CREATES this object on every Dataplane V2 cluster; any other
          # name is a second object that logs nothing.
          assert d['metadata']['name'] == 'default', d['metadata']['name']
          assert d['spec']['cluster']['deny']['log'] is True
          assert d['spec']['cluster']['allow']['log'] is False
          # `delegate` is the OTHER leaf on each side and was pinned by nothing:
          # flipping either was green. It hands per-namespace override to
          # NetworkLoggingConfig objects; false keeps this cluster-scoped object
          # the single answer, which is what "deny is logged everywhere" needs.
          assert d['spec']['cluster']['deny']['delegate'] is False
          assert d['spec']['cluster']['allow']['delegate'] is False
          PY
      - name: Spike scripts + manifests (when present)
        run: |
          if [ -d infra/spike ]; then
            for f in infra/spike/*.sh; do bash -n "$f"; done
            python3 -c "import glob,yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('infra/spike/manifests/*.yaml')]"
          else
            echo "no infra/spike on this ref (T1.0 branch not merged) — skipping"
          fi

