name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # authority-paths reads the PR diff via gh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Task files valid (schema, deps, caps)
        run: node scripts/spec-sync/validate.mjs
      - name: protect-authority hook regression tests
        run: bash .claude/hooks/protect-authority.test.sh
      - name: Authority paths unchanged (human decision only — AGENTS.md hard rule)
        if: github.event_name == 'pull_request'
        shell: bash   # GitHub's default is `bash -e {0}` with NO pipefail; without this a
                      # failing `gh pr diff` yields an empty changed-set and the step reports
                      # "untouched" — failing OPEN exactly when it did not run.
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The PreToolUse hook is an accident floor a determined agent can talk around.
          # This reads the PR diff, so no call-shape trick reaches it and --no-verify does
          # not apply. It REPORTS reliably; whether it BLOCKS depends on branch protection,
          # which this repo does not currently have — see O6g. Do not describe it as binding
          # until that is true.  O6f.
          #
          # gh pr diff, not `git diff BASE HEAD`: the checkout is shallow (head.sha is absent
          # -> "fatal: bad object"), and a two-dot range also re-reports paths that landed on
          # main after the branch started, which trains people to bypass on unrelated PRs.
          # Two statements, not one pipeline: a `gh` failure must fail the job, never produce
          # an empty changed-set that reads as "clean".
          files="$(gh pr diff "$PR" --name-only)"
          changed="$(printf '%s\n' "$files" | grep -E '^(docs/product/00-sources/|docs/product/18-philosophy/decisions\.md$)' || true)"
          [ -z "$changed" ] && { echo "authority-paths: untouched"; exit 0; }
          # The guarded set is FOUNDER-AUTHORITY paths only. ci.yml and .claude/hooks/ were in it
          # briefly and had to come out: they are engineering files under ADR-0008 review, so
          # guarding them made every legitimate maintenance PR require a founder marker (this
          # check failed its own PR, #292). It bought nothing either — a pull_request runs the
          # workflow from the PR head, so a PR deleting this step never evaluates its own
          # removal. Real self-protection needs a required check name under branch protection: O6g.
          #
          # The marker must be the FIRST line of the body. Matching anywhere let the job's own
          # failure text arm it, because the house rules require pasting CI output into the PR.
          if gh pr view "$PR" --json body -q .body | head -1 | grep -qE '^FOUNDER-RATIFIED\b'; then
            echo "authority-paths: changed WITH founder marker — allowed, recorded:"; echo "$changed"; exit 0
          fi
          echo "::error::These paths change by human decision only (AGENTS.md hard rules):"
          echo "$changed"
          echo "A founder-ratified change carries the ratification marker on the PR body's first line."
          exit 1
      - name: Client regeneration drift (type drift fails the build — Q3/§17)
        run: |
          make gen-ts
          git add -A -- apps packages docs
          git diff --cached --exit-code -- apps packages docs
      - name: Console lint + typecheck + tests + build
        run: |
          pnpm --filter console lint
          pnpm --filter console typecheck
          pnpm --filter console test
          pnpm --filter console build
      - name: SDK typecheck + tests
        run: |
          pnpm --filter @steloit/sdk typecheck
          pnpm --filter @steloit/sdk test
      - name: Canon invariants (typecheck + tests)
        run: |
          pnpm --filter @steloit/canon typecheck
          pnpm --filter @steloit/canon test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: "services/api/go.sum" }
      - name: Generate (drift fails the build — §16/§17)
        run: |
          make gen-go
          # gen-sql, not just gen-go: oapi-codegen regenerates the CONTRACT, but
          # db/queries/*.sql -> internal/*/store/*.sql.go has its own generator,
          # and only the generated file executes. Without this line a .sql edit
          # that never reached sqlc ships a query nobody reviewed, and every test
          # still passes because the tests run the generated file. US-1.3a was
          # the near-miss: a `AND status <> 'deleting'` fence present in the .sql
          # and absent from services.sql.go, so the security close was dead code.
          # sqlc is pinned (Makefile) — a version bump reformats generated output
          # and would fail this gate for the wrong reason.  O7.
          make gen-sql
          make gen-canon
          git add -A -- services packages apps
          git diff --cached --exit-code -- services packages apps
      # gofmt BEFORE the build, so a formatting failure reports as itself rather
      # than as a confusing test failure. `go vet` does not check formatting, so
      # nothing in this pipeline has ever reported it: two test files sat
      # unformatted on the base branch until O13 went looking.  O13
      - name: gofmt (every Go module)
        run: |
          set -euo pipefail
          # DERIVED from the repo, not retyped. The list was hardcoded here and
          # again in the test step below; a fifth module would silently get no
          # gofmt, no vet, no test and no -race, and nothing would say so. The
          # QA review confirmed the four are complete TODAY and that a module
          # outside them is invisible to this loop.
          for m in $(git ls-files '*/go.mod' | xargs -n1 dirname); do
            # 2>&1, and the exit-status check, are both load-bearing: gofmt writes
            # PARSE errors to stderr and lists nothing on stdout, so the obvious
            # `out="$(gofmt -l "$m")"` reports CLEAN for a file that does not
            # parse. Caught by mutating a file into a syntax error and watching
            # this step pass. `go build` would still fail such a commit, but a
            # gate that answers "clean" for input it could not read is a gate
            # that lies, and the next person to reuse this loop inherits it.
            if ! out="$(gofmt -l "$m" 2>&1)"; then
              echo "::error::gofmt could not read $m (a file may not parse):"; echo "$out"; exit 1
            fi
            [ -z "$out" ] || { echo "::error::unformatted Go files in $m:"; echo "$out"; exit 1; }
          done
      - name: Build + vet + test
        # STELOIT_REQUIRE_CONTAINERS turns a missing container runtime from a
        # SKIP into a FAILURE. Without it, internal/reconcile, internal/identity
        # and internal/platform/db each t.Skipf when Docker is unavailable and
        # the package still prints `ok` — so the job is green having run nothing.
        # -timeout 30m below is derived from identity measuring ~350s, which is
        # meaningless for a suite that skips; and -race never examines the
        # container-backed concurrency suites at all, which is where the next
        # such defect lives. (NOT where the last one did: O14's race was in
        # reconcile_test.go's in-memory fakes and runs either way.)  O23
        env:
          STELOIT_REQUIRE_CONTAINERS: "1"
        # -race, and this is the decision O13 asked for rather than a default.
        # It had never run in CI at all, which is how O14 (a data race in the
        # reconcile test fixture) reached the base branch and sat there a month.
        # Measured cost on this suite: ~4 min without, ~9 min with — identity
        # 274-332s and reconcile 113-129s dominate, and both are container-bound
        # rather than CPU-bound, so the detector is not the whole delta. Five
        # minutes is worth a detector that runs on every PR instead of never.
        #
        # -timeout 30m, explicitly: the default is 10 MINUTES PER PACKAGE, and
        # internal/identity measured 346s serially and EXCEEDED 600s under
        # contention on an M-series Mac (US-3.8). A hosted runner is slower. That
        # failure presents as a broken suite rather than as "raise the limit",
        # which is the kind of failure that gets diagnosed wrong.
        run: |
          # -count=1 DISABLES THE TEST CACHE, and it is load-bearing, not hygiene.
          # cmd/go's cache invalidation tracks files a test opens under its own
          # package directory. A fixture read from anywhere else — a repo-root
          # testdata/, a sibling module's file, a migration .sql two directories
          # up — is NOT a tracked input, so editing it leaves `ok (cached)`.
          # Measured (US-3.3a QA, 2026-08-23): a PR that changed ONLY a repo-root
          # JSON fixture two Go modules assert against came back `ok (cached)` in
          # both, and RED in both with -count=1. actions/setup-go restores GOCACHE
          # across commits keyed on go.sum, so this is reachable on a real PR, and
          # it fails OPEN — the cross-module pin reports green while broken.
          cd services/api && go build ./... && go vet ./... && go test -count=1 -race -timeout 30m ./...
          cd ../cell-agent && go build ./... && go vet ./... && go test -count=1 -race -timeout 10m ./...
          cd ../../packages/contracts/go && go build ./...
          cd ../../../apps/cli && go build ./... && go vet ./... && go test -count=1 -race -timeout 10m ./...
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.8" }
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      - name: Validate envs (credential-free)
        run: |
          terraform -chdir=infra/envs/dev init -backend=false -input=false
          terraform -chdir=infra/envs/dev validate
          terraform -chdir=infra/envs/cell0 init -backend=false -input=false
          terraform -chdir=infra/envs/cell0 validate
      - name: k8s manifests parse (always)
        run: |
          python3 -c "import glob,yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('infra/k8s/**/*.yaml', recursive=True)]"
      - name: Spike scripts + manifests (when present)
        run: |
          if [ -d infra/spike ]; then
            for f in infra/spike/*.sh; do bash -n "$f"; done
            python3 -c "import glob,yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('infra/spike/manifests/*.yaml')]"
          else
            echo "no infra/spike on this ref (T1.0 branch not merged) — skipping"
          fi

