name: image
# T1.3: build -> sign (keyless) -> provenance, from the FIRST build (inv. 11).
# Path-gated: dormant until services/** exists; must already be green when
# services/api is born (E2/E3). Zero static keys — WIF only (D5).
on:
  push:
    branches: [main]
    paths: ["services/**", "Dockerfile*"]
  pull_request:
    paths: ["services/**", "Dockerfile*"]

env:
  REGION: us-central1
  REPO: steloit

permissions:
  contents: read
  id-token: write # OIDC for WIF + cosign keyless

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }} # project-base output
          service_account: ${{ vars.CI_IMAGE_SA }}
      - uses: docker/setup-buildx-action@v3
      - name: AR login
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build + push (provenance attached)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: ${{ github.event_name == 'push' }}
          provenance: mode=max
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ env.REPO }}/api:${{ github.sha }}
      - name: Cosign keyless sign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
      - name: Sign digest
        if: github.event_name == 'push'
        run: |
          cosign sign --yes \
            "${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${REPO}/api@${{ steps.build.outputs.digest }}"
