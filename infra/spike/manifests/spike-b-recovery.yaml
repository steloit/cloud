apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spike-b
  namespace: spike
spec:
  instances: 1
  storage:
    storageClass: zfs-spike
    size: 10Gi
  bootstrap:
    recovery:
      volumeSnapshots:
        storage:
          name: spike-a-snap
          kind: VolumeSnapshot
          apiGroup: snapshot.storage.k8s.io
  postgresql:
    parameters:
      archive_timeout: "300s"
  affinity:
    tolerations:
      - {key: storage, operator: Equal, value: zfs, effect: NoSchedule}
    nodeSelector:
      pool: zfs-storage
